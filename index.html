<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>Vault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --st:max(env(safe-area-inset-top),var(--tg-safe-area-inset-top,0px));
  --sb:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.9,.2,1);
}
[data-theme=dark]{
  --bg:#0b0c0e;
  --t1:rgba(255,255,255,.96);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);
  --hair:rgba(255,255,255,.10);--hair-strong:rgba(255,255,255,.30);--focus:rgba(255,255,255,.06);
  --g-bg:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));
  --g-blur:10px;--g-edge:rgba(255,255,255,.62);--g-edge2:rgba(255,255,255,.07);--g-sheen:rgba(255,255,255,.10);
  --g-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 1px rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.42);
  --inp-bg:rgba(255,255,255,.06);
  --sheet-bg:linear-gradient(180deg,rgba(30,30,36,.66),rgba(12,12,16,.80));
  --lens:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
  --blob1:#3b3e46;--blob2:#2a2d33;--blob3:#46494f;--blob-o:.55;
  --knob-shadow:0 6px 16px rgba(0,0,0,.55);
  --inv:#0b0b0f;
}
[data-theme=light]{
  --bg:#eef0f3;
  --t1:#0c0c11;--t2:rgba(20,20,30,.58);--t3:rgba(20,20,30,.34);
  --hair:rgba(20,20,40,.08);--hair-strong:rgba(20,20,40,.22);--focus:rgba(20,20,40,.05);
  --g-bg:linear-gradient(160deg,rgba(255,255,255,.66),rgba(255,255,255,.30) 55%,rgba(255,255,255,.46));
  --g-blur:12px;--g-edge:#ffffff;--g-edge2:rgba(255,255,255,.35);--g-sheen:rgba(255,255,255,.55);
  --g-shadow:inset 0 1px 0 #fff,inset 0 -1px 1px rgba(255,255,255,.6),0 1px 2px rgba(20,20,50,.06),0 14px 32px rgba(20,20,60,.10);
  --inp-bg:rgba(255,255,255,.55);
  --sheet-bg:linear-gradient(180deg,rgba(250,250,252,.80),rgba(238,239,244,.90));
  --lens:linear-gradient(180deg,#fff,rgba(255,255,255,.75));
  --blob1:#ffffff;--blob2:#d9dce3;--blob3:#e6e8ec;--blob-o:.9;
  --knob-shadow:0 6px 16px rgba(30,30,60,.22);
  --inv:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior:none;letter-spacing:-.01em;transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--bg) 82%,#fff) 0%,var(--bg) 45%,color-mix(in srgb,var(--bg) 90%,#000) 100%);pointer-events:none}
[data-theme=light] .bg{background:linear-gradient(165deg,#f7f8fa 0%,#eceef2 55%,#e2e5ea 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-o);will-change:transform}
.bg .b1{width:75vmax;height:75vmax;left:-30vmax;top:-35vmax;background:var(--blob1);animation:d1 24s ease-in-out infinite alternate}
.bg .b2{width:60vmax;height:60vmax;right:-32vmax;top:18vh;background:var(--blob2);animation:d2 28s ease-in-out infinite alternate}
.bg .b3{width:55vmax;height:55vmax;left:-12vmax;bottom:-38vmax;background:var(--blob3);animation:d3 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(14vmax,12vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-12vmax,-8vmax) scale(.9)}}
@keyframes d3{to{transform:translate(10vmax,-10vmax) scale(1.08)}}

/* ---------- liquid glass ---------- */
.glass{position:relative;background:var(--g-bg);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(180%);backdrop-filter:blur(var(--g-blur)) saturate(180%);box-shadow:var(--g-shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--g-edge) 0%,var(--g-edge2) 26%,transparent 50%,var(--g-edge2) 74%,var(--g-edge) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 18% 0%,var(--g-sheen),transparent 60%)}
.prism::before{background:conic-gradient(from 210deg,var(--g-edge) 0%,var(--g-edge2) 16%,rgba(255,214,10,.28) 23%,rgba(100,210,255,.3) 26%,var(--g-edge2) 34%,transparent 50%,var(--g-edge2) 64%,var(--g-edge) 76%,rgba(191,90,242,.22) 82%,var(--g-edge2) 90%,var(--g-edge) 100%)}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(var(--st) + var(--tg-content-safe-area-inset-top,0px) + 22px) 16px calc(var(--sb) + 128px)}
.view>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.035em}
.sub{color:var(--t2);font-size:15px;line-height:1.4}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.sect-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sect-title h3{font-size:20px;font-weight:650;letter-spacing:-.02em}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stats{display:flex;gap:18px;margin-top:14px}
.stat b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--t3)}

/* circle glass button */
.cbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s var(--ease)}
.cbtn:active{transform:scale(.9)}
.cbtn svg{width:20px;height:20px}
.cbtn.danger{color:#ff453a}

/* capture pill */
.capture{margin-top:22px;height:60px;border-radius:999px;display:flex;align-items:center;padding:0 8px 0 22px;width:100%;text-align:left;color:var(--t3);font-size:16px;transition:transform .25s var(--ease)}
.capture:active{transform:scale(.98)}
.capture .mini{margin-left:auto;width:44px;height:44px;position:relative;flex:none}

/* grid & tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tile{border-radius:28px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .25s var(--ease)}
.tile:active{transform:scale(.965)}
.tile.wide{grid-column:span 2;min-height:0;gap:14px}
.tile .n{font-size:15px;font-weight:600;margin-top:10px}
.tile .m{font-size:12.5px;color:var(--t3);margin-top:3px}
.tile .cnt{font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--c);flex:none;background:var(--inp-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ico svg{width:20px;height:20px;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 55%,transparent))}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}

.bar{height:6px;border-radius:6px;background:var(--inp-bg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0a84ff,#64d2ff 60%,#bf5af2);box-shadow:0 0 12px rgba(100,210,255,.6);transition:width .6s var(--ease)}

/* lists */
.group{border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--hair)}
.li .ico{width:32px;height:32px;border-radius:11px}
.li .ico svg{width:16px;height:16px}
.li .tt{font-size:15px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li .dd{font-size:12px;color:var(--t3);margin-top:2px}
.li .mid{flex:1;min-width:0}

.card{display:block;width:100%;text-align:left;border-radius:24px;padding:16px 16px 14px;margin-bottom:10px;transition:transform .25s var(--ease)}
.card:active{transform:scale(.98)}
.card .ct{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.card .cb{font-size:15px;color:var(--t2);line-height:1.45;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .cf{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--t3)}
.card .done-t{text-decoration:line-through;color:var(--t3)}
.lesson{margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#ff9f0a 12%,transparent);border:1px solid color-mix(in srgb,#ff9f0a 28%,transparent);font-size:14px;line-height:1.4}
.lesson b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#ff9f0a;display:block;margin-bottom:3px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--inp-bg);border:1px solid var(--hair);font-size:12px;color:var(--t2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--t3);display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.chk svg{width:16px;height:16px;opacity:0;color:#fff}
.chk.on{background:#30d158;border-color:#30d158;box-shadow:0 0 14px rgba(48,209,88,.55)}
.chk.on svg{opacity:1}

.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty .ico{width:64px;height:64px;border-radius:22px;margin:0 auto 16px}
.empty .ico svg{width:28px;height:28px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;font-size:14px;background:var(--inp-bg);border:1px solid var(--hair);color:var(--t2);transition:all .2s}
.chip.on{background:var(--t1);color:var(--inv);border-color:transparent}

.moodstrip{display:flex;gap:3px;height:10px;margin-top:16px;border-radius:6px;overflow:hidden}
.moodstrip i{flex:1;background:var(--c);opacity:.85}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--sb) + 88px);z-index:20;width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.92)}

/* tabbar */
.tabbar{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px}
.tab{width:66px;height:48px;border-radius:999px;display:grid;place-items:center;color:var(--t3);position:relative;transition:color .25s}
.tab svg{width:22px;height:22px;position:relative;z-index:1}
.tab.on{color:var(--t1)}
.tab.on::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lens);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.15)}

/* ---------- siri ring ---------- */
.siri{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.siri .halo{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#ff2d55,#ff9f0a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff2d55);filter:blur(10px);opacity:.8;animation:spin 3.4s linear infinite}
.siri .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 90deg,#bf5af2,#0a84ff,#64d2ff,#ffffff,#ffd60a,#ff9f0a,#ff375f,#bf5af2);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 2.3s linear infinite reverse}
.siri .ring2{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(transparent 0 62%,rgba(255,255,255,.95) 80%,transparent 92%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 1.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.knob{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#3a3a42;
  background:radial-gradient(circle at 50% 30%,#ffffff 0%,#f5f5f8 55%,#dcdce3 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.10),inset 0 2px 2px #fff,var(--knob-shadow)}
.knob svg{width:24px;height:24px;stroke-width:2.6}

/* ---------- swipe to save ---------- */
.swipe{height:68px;border-radius:999px;position:relative;overflow:visible;user-select:none;-webkit-user-select:none;touch-action:none}
.swipe-fill{position:absolute;left:5px;top:5px;bottom:5px;width:58px;border-radius:999px;
  background:linear-gradient(90deg,rgba(191,90,242,.0),rgba(100,210,255,.22),rgba(255,214,10,.18));opacity:0;transition:opacity .3s}
.swipe.drag .swipe-fill,.swipe.done .swipe-fill{opacity:1}
.swipe-label{position:absolute;inset:0;display:grid;place-items:center;padding-left:48px;font-size:17px;font-weight:500;pointer-events:none;
  background:linear-gradient(90deg,var(--t3) 0%,var(--t3) 38%,var(--t1) 50%,var(--t3) 62%,var(--t3) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
@keyframes shimmer{from{background-position:125% 0}to{background-position:-125% 0}}
.knob-wrap{position:absolute;left:5px;top:5px;width:58px;height:58px;touch-action:none;cursor:grab;z-index:2}
.swipe.drag .knob-wrap{cursor:grabbing}
.swipe.drag .siri .halo{animation-duration:1.2s;opacity:1}
.swipe.drag .siri .ring{animation-duration:.9s}
.swipe.done .siri .halo{animation-duration:.8s;opacity:1;inset:-11px}
.swipe.done .knob{color:#30d158}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;border-radius:34px 34px 0 0;
  padding:10px 16px calc(var(--sb) + 18px);max-height:calc(100vh - var(--st) - var(--tg-content-safe-area-inset-top,0px) - 12px);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(105%);transition:transform .5s var(--ease);--g-bg:var(--sheet-bg);--g-blur:26px}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--t3);margin:0 auto 12px;opacity:.55}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh-date{font-size:13px;color:var(--t3);margin-top:4px}
.sh-foot{margin-top:18px}
.field{margin-bottom:14px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin:0 4px 8px;display:flex;justify-content:space-between}
.inp{width:100%;border-radius:18px;padding:14px 16px;font-size:16px;background:var(--inp-bg);border:1px solid var(--hair);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--hair-strong);box-shadow:0 0 0 4px var(--focus)}
.inp::placeholder{color:var(--t3)}
.inp.title{font-size:24px;font-weight:650;letter-spacing:-.025em;background:transparent;border:0;padding:6px 4px;box-shadow:none}
.inp.body{background:transparent;border:0;padding:4px 4px;min-height:110px;resize:none;line-height:1.5;font-size:17px;box-shadow:none}
textarea.inp{resize:none;line-height:1.45;min-height:84px}
select.inp{background-image:none}
.box{border-radius:22px;padding:14px}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--inp-bg);border:1px solid var(--hair);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+i{background:#30d158}
.switch input:checked+i::after{transform:translateX(20px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#0a84ff,#64d2ff var(--p),var(--inp-bg) var(--p));box-shadow:inset 0 0 0 1px var(--hair)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#e4e4ea);box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--inp-bg)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:#64d2ff}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--t3);padding:4px 0}
.mood i{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));opacity:.45;transition:all .3s var(--ease);box-shadow:inset 0 -3px 6px rgba(0,0,0,.2)}
.mood.on i{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--c),0 0 22px var(--c)}
.mood.on{color:var(--t1)}

/* ---------- lock ---------- */
.lock{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:10px}
.orb{width:128px;height:128px;position:relative;margin:34px 0 30px}
.orb-core{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:var(--t1)}
.orb-core svg{width:40px;height:40px;stroke-width:1.6}
.orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--hair);pointer-events:none}
.orb.busy::after{border-color:transparent;border-top-color:var(--t2);animation:spin .9s linear infinite}
.pwrow{display:flex;gap:10px;align-items:center;width:100%;max-width:380px;margin-top:10px}
.pw{flex:1;height:60px;border-radius:999px;display:flex;align-items:center;padding:0 8px 0 22px}
.pw input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px;height:100%}
.pw input::placeholder{color:var(--t3)}
.pw .eye{width:40px;height:40px;display:grid;place-items:center;color:var(--t3)}
.pw .eye svg{width:20px;height:20px}
.go{width:60px;height:60px;position:relative;flex:none;transition:transform .2s var(--ease)}
.go:active{transform:scale(.92)}
.go[disabled]{opacity:.6}
.link{margin-top:26px;color:var(--t2);font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--hair-strong)}
.err{color:#ff453a;font-size:14px;margin-top:14px;min-height:20px}
.note{margin-top:34px;font-size:12px;color:var(--t3);max-width:320px;line-height:1.5}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- settings ---------- */

  const d=new Date(t), n=new Date(), s=(n-d)/1000;

  if (s<3600) return Math.floor(s/60)+' min ago';
  const hm = pad(d.getHours())+':'+pad(d.getMinutes());
  if (dayKey(d)===dayKey(n)) return 'today, '+hm;

}

  if (days===0) return base+' · today';

}

/* ---------- crypto ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKeys(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(CONFIG.APP_SALT), iterations:250000, hash:'SHA-256'}, base, 512));
  const key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['encrypt','decrypt']);
  const id = [...bits.slice(32)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return {key, id};
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12);
  return b64(out);
}
async function decryptJSON(key, s){
  const u = unb64(s);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, key, u.slice(12));
  return JSON.parse(dec.decode(pt));
}

/* ---------- storage (Supabase or demo) ---------- */
const REMOTE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const Store = {
  async rpc(fn, args){
    const k = CONFIG.SUPABASE_KEY;
    const headers = {'Content-Type':'application/json', apikey:k};
    if (!k.startsWith('sb_')) headers.Authorization = 'Bearer '+k;
    let r;
    try { r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn, {method:'POST', headers, body:JSON.stringify(args)}); }
    catch(e){ throw new Error('No internet connection'); }
    const t = await r.text();
    if (!r.ok){ let m=t; try{ m=JSON.parse(t).message||t; }catch(e){} const err=new Error(m); err.conflict=/conflict/.test(m); err.exists=/exists/.test(m); throw err; }
    return t ? JSON.parse(t) : null;
  },
  async get(id){
    if (REMOTE) return await this.rpc('get_vault', {p_id:id});
    const raw = LS.get('xz-v-'+id) || MEM[id]; return raw ? JSON.parse(raw) : null;
  },
  async put(id, data, version){
    if (REMOTE) return await this.rpc('put_vault', {p_id:id, p_data:data, p_version:version});
    const cur = await this.get(id);
    if (!cur && version!==0){ const e=new Error('conflict'); e.conflict=true; throw e; }
    if (cur && version===0){ const e=new Error('exists'); e.exists=true; throw e; }
    if (cur && cur.version!==version){ const e=new Error('conflict'); e.conflict=true; throw e; }
    const nv = version+1, raw = JSON.stringify({data, version:nv});
    MEM[id]=raw; LS.set('xz-v-'+id, raw); return nv;
  },
  async del(id, version){
    if (REMOTE) return await this.rpc('delete_vault', {p_id:id, p_version:version});
    delete MEM[id]; try{ localStorage.removeItem('xz-v-'+id); }catch(e){}
  }
};

async function pull(){
  const row = await Store.get(S.id);
  if (!row) throw new Error('Data not found');

}
async function mutate(fn){
  for (let i=0;i<4;i++){
    const draft = JSON.parse(JSON.stringify(S.vault)); fn(draft);
    try{
      const data = await encryptJSON(S.key, draft);
      S.version = await Store.put(S.id, data, S.version);
      S.vault = draft; render(); return true;
    }catch(e){
      if (e.conflict){ try{ await pull(); }catch(_){} continue; }
      toast('Not saved: '+e.message, true); hap.err(); return false;
    }
  }

}

    if (pw.length<6) return fail('Password must be at least 6 characters');
    if (create && pw!==p2.value) return fail('Passwords do not match');
    btn.disabled=true; orb.classList.add('busy'); document.activeElement && document.activeElement.blur();

async function unlock(pw, create){
  const {key,id} = await deriveKeys(pw);
  const row = await Store.get(id);
  let vault, version;
  if (create){
    if (row) throw new Error('A vault with this password already exists — sign in instead');
    vault = {v:1, created:Date.now(), members: myId?[{id:myId, name:displayName(me)||'Me', owner:true}]:[], entries:[]};
    version = await Store.put(id, await encryptJSON(key, vault), 0);
  } else {
    if (!row) throw new Error('Wrong password');
    try{ vault = await decryptJSON(key, row.data); }catch(e){ throw new Error('Wrong password'); }
    version = row.version;
  }
  if (myId && vault.members.length && !vault.members.some(m=>m.id===myId)){
    S.denied = true; render(); return;
  }
  Object.assign(S, {key, id, version, vault, view:'home', denied:false});
  hap.ok();
  if (myId && !vault.members.length) await mutate(v=>{ v.members.push({id:myId, name:displayName(me)||'Me', owner:true}); });
  render();
}

}

function lock(){
  Object.assign(S, {key:null, id:null, version:0, vault:null, view:'home', denied:false, lockMode:'login'});
  closeSheet(true); render();
}
let hiddenAt=0;
document.addEventListener('visibilitychange', async ()=>{
  if (document.hidden){ hiddenAt=Date.now(); return; }
  if (!S.key) return;
  if (hiddenAt && Date.now()-hiddenAt > CONFIG.AUTO_LOCK_MIN*60000){ lock(); return; }
  if (REMOTE && !S.sheet){ try{ await pull(); render(); }catch(e){} }
});

function render(){
  if (!S.key) return S.denied ? renderDenied() : renderLock();
  let html='';
  if (S.view==='home') html=vHome();
  else if (S.view==='section') html=vSection();
  else if (S.view==='search') html=vSearch();
  else html=vSettings();
  app.innerHTML = `<main class="view">${html}</main>${tabbar()}${S.view==='section'?`<button class="fab glass prism" data-act="new" data-v="${S.section}" aria-label="New">${ic('plus',2)}</button>`:''}`;
  if (S.view==='search') bindSearch();
  updateBack();
}

  const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return t;

}

function openSheet(html, mount){
  const root=$('#sheetRoot');
  root.innerHTML=`<div class="scrim"></div><div class="sheet glass" role="dialog">${html}</div>`;
  const sc=root.querySelector('.scrim'), sh=root.querySelector('.sheet');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ sc.classList.add('on'); sh.classList.add('on'); }));
  sc.onclick=()=>closeSheet();
  sh.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet());
  S.sheet=true; mount && mount(sh); updateBack();
}
function closeSheet(instant){
  const root=$('#sheetRoot'), sc=root.querySelector('.scrim'), sh=root.querySelector('.sheet');
  S.sheet=false; updateBack();
  if(!sh) return;
  if(instant){ root.innerHTML=''; return; }
  sc.classList.remove('on'); sh.classList.remove('on');
  setTimeout(()=>{ if(!S.sheet) root.innerHTML=''; }, 480);
}

function swipeHTML(label){
  return `<div class="swipe glass prism" data-swipe><div class="swipe-fill"></div><span class="swipe-label">${label}</span><div class="knob-wrap">${siri()}<div class="knob">${ic('chev')}</div></div></div>`;
}
function bindSwipe(root, onDone){
  const el=root.querySelector('[data-swipe]'), kw=el.querySelector('.knob-wrap'), lab=el.querySelector('.swipe-label'), fill=el.querySelector('.swipe-fill'), knob=kw.querySelector('.knob');
  let x=0, start=0, drag=false, max=0, busy=false, lastStep=0;
  const set=(v,anim)=>{
    x=v; const tr=anim?'transform .5s var(--ease), width .5s var(--ease)':'none';
    kw.style.transition=tr; fill.style.transition=anim?'width .5s var(--ease), opacity .3s':'opacity .3s';
    kw.style.transform=`translateX(${v}px)`; fill.style.width=(v+58)+'px';
    lab.style.opacity=String(Math.max(0,1-v/(Math.max(1,max)*.55)));
  };
  kw.addEventListener('pointerdown', e=>{
    if(busy) return; drag=true; max=el.clientWidth-kw.offsetWidth-10; start=e.clientX-x;
    try{ kw.setPointerCapture(e.pointerId); }catch(_){}
    el.classList.add('drag'); hap.t('light'); document.activeElement && document.activeElement.blur && document.activeElement.blur();
  });
  kw.addEventListener('pointermove', e=>{
    if(!drag) return; const v=Math.min(max,Math.max(0,e.clientX-start)); set(v);
    const step=Math.floor(v/(max/5)); if(step!==lastStep){ lastStep=step; hap.sel(); }
  });
  const end=async()=>{
    if(!drag) return; drag=false; el.classList.remove('drag');
    if(x>max*.8){
      set(max,true); busy=true; el.classList.add('done'); knob.innerHTML=ic('tick',2.6); hap.t('heavy');
      const ok=await onDone();
      if(!ok){ busy=false; el.classList.remove('done'); knob.innerHTML=ic('chev'); set(0,true); }
    } else set(0,true);
  };
  kw.addEventListener('pointerup', end); kw.addEventListener('pointercancel', end);
  set(0);
}

    <div class="sh-head">
      <div style="--c:${s.c}"><div class="row" style="gap:8px"><i class="dot"></i><span class="eyebrow" style="color:var(--t2)">${s.n}</span></div><div class="sh-date">${isNew?longDate(Date.now()):'Created '+rel(d.c)}</div></div>
      <div class="row">${isNew?'':`<button class="cbtn glass danger" data-del aria-label="Delete">${ic('trash')}</button>`}<button class="cbtn glass" data-close aria-label="Close">${ic('x',2)}</button></div>
    </div>
    ${fields}
    <div class="sh-foot">${swipeHTML(isNew?'slide to save':'slide to update')}</div>`;
  openSheet(html, sh=>{
    sh.querySelectorAll('[data-f]').forEach(el=>{
      const f=el.dataset.f;
      const upd=()=>{
        d[f] = el.type==='checkbox'?el.checked : el.type==='range'?+el.value : el.value;
        if (el.type==='range'){ el.style.setProperty('--p', el.value+'%'); $('#pv',sh).textContent=el.value+'%'; hap.sel(); }
        if (el.tagName==='TEXTAREA') autoGrow(el);
      };
      el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input', upd);
      if (el.tagName==='TEXTAREA') setTimeout(()=>autoGrow(el),0);
    });
    sh.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{ d.mood=+b.dataset.mood; sh.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('on',x===b)); hap.t('medium'); });
    sh.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{ d.status=+b.dataset.status; sh.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('on',x===b)); hap.sel(); });
    const del=sh.querySelector('[data-del]');
    if (del) del.onclick=async()=>{
      if(!(await confirmDlg('This entry will be permanently deleted. Continue?'))) return;
      const ok=await mutate(v=>{ v.entries=v.entries.filter(x=>x.id!==d.id); if(d.s==='big') v.entries.forEach(x=>{ if(x.parent===d.id) x.parent=''; }); });
      if(ok){ closeSheet(); toast('Deleted'); hap.ok(); }
    };
    bindSwipe(sh, async ()=>{
      d.title=(d.title||'').trim(); d.body=(d.body||'').trim(); d.lesson=(d.lesson||'').trim();
      if (k==='feel' && !d.mood){ toast('Pick a mood first', true); hap.err(); return false; }
      if (k!=='feel' && !d.title && !d.body){ toast('Write something first', true); hap.err(); return false; }
      if (!d.id){ d.id=uid(); d.c=Date.now(); }
      d.u=Date.now(); d.by=myId||null;
      if (k==='big') d.progress=Math.max(0,Math.min(100,+d.progress||0));
      const ok=await mutate(v=>{ const i=v.entries.findIndex(x=>x.id===d.id); if(i>=0) v.entries[i]=d; else v.entries.push(d); });
      if (ok){ hap.ok(); toast(isNew?'Saved':'Updated'); setTimeout(()=>closeSheet(),350); }
      return ok;
    });
    if (isNew){ const first=sh.querySelector('.inp.title')||sh.querySelector('.inp.body'); if(first && k!=='feel') setTimeout(()=>first.focus(),450); }
  });
}

function openAddMember(){
  const html=`
    <div class="grab"></div>
    <div class="sh-head"><div><span class="eyebrow" style="color:var(--t2)">Access</span><div class="sh-date">Add a second account</div></div><button class="cbtn glass" data-close>${ic('x',2)}</button></div>
    <p class="sub" style="margin:4px 4px 16px;font-size:14px">Open the bot from the second account and enter the password. Type the ID it shows here.</p>
    <div class="field"><div class="label">Telegram ID</div><input class="inp mono" id="mId" inputmode="numeric" placeholder="123456789" style="font-size:17px"></div>
    <div class="field"><div class="label">Name</div><input class="inp" id="mName" placeholder="e.g. Second account" maxlength="40"></div>
    <div class="sh-foot">${swipeHTML('slide to add')}</div>`;
  openSheet(html, sh=>{
    bindSwipe(sh, async ()=>{
      const id=$('#mId',sh).value.replace(/\D/g,''), name=$('#mName',sh).value.trim()||'Second account';
      if(id.length<5){ toast('Enter a valid ID', true); hap.err(); return false; }
      if(S.vault.members.some(m=>m.id===id)){ toast('This account is already added', true); return false; }
      const ok=await mutate(v=>{ v.members.push({id, name, owner:false, added:Date.now()}); });
      if(ok){ hap.ok(); toast('Added'); setTimeout(()=>closeSheet(),350); }
      return ok;
    });
  });
}

function openChangePw(){
  const html=`
    <div class="grab"></div>
    <div class="sh-head"><div><span class="eyebrow" style="color:var(--t2)">Security</span><div class="sh-date">New password</div></div><button class="cbtn glass" data-close>${ic('x',2)}</button></div>
    <p class="sub" style="margin:4px 4px 16px;font-size:14px">All entries will be re-encrypted with the new password. The second account will also use the new password.</p>
    <div class="field"><div class="label">New password</div><input class="inp" id="np1" type="password" autocomplete="new-password"></div>
    <div class="field"><div class="label">Repeat</div><input class="inp" id="np2" type="password" autocomplete="new-password"></div>
    <div class="sh-foot">${swipeHTML('slide to change')}</div>`;
  openSheet(html, sh=>{
    bindSwipe(sh, async ()=>{
      const a=$('#np1',sh).value, b=$('#np2',sh).value;
      if(a.length<6){ toast('At least 6 characters', true); hap.err(); return false; }
      if(a!==b){ toast('Passwords do not match', true); hap.err(); return false; }
      try{
        const {key,id}=await deriveKeys(a);
        if(id===S.id){ toast('That’s your current password', true); return false; }
        if(await Store.get(id)){ toast('This password can’t be used', true); return false; }
        await pull();
        const nv=await Store.put(id, await encryptJSON(key, S.vault), 0);
        try{ await Store.del(S.id, S.version); }catch(e){}
        Object.assign(S,{key,id,version:nv});
        hap.ok(); toast('Password changed'); setTimeout(()=>closeSheet(),350); return true;
      }catch(e){ toast('Error: '+e.message, true); return false; }
    });
  });
}

/* ---------- navigation ---------- */
function goBack(){
  if (S.sheet) return closeSheet();
  if (S.key && S.view!=='home'){ S.view='home'; render(); window.scrollTo(0,0); }
}
function updateBack(){
  if(!inTg || !tg.BackButton) return;
  try{ (S.sheet || (S.key && S.view!=='home')) ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){}
}
if (inTg && tg.BackButton){ try{ tg.BackButton.onClick(goBack); }catch(e){} }

document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case 'tab': if(S.view!==v){ S.view=v; hap.sel(); render(); window.scrollTo(0,0); } break;
    case 'sec': S.section=v; S.filter='all'; S.view='section'; hap.t(); render(); window.scrollTo(0,0); break;
    case 'back': goBack(); break;
    case 'new': hap.t(); openEditor(v||S.section); break;
    case 'open': { const en=E().find(x=>x.id===v); if(en){ hap.t(); openEditor(en.s,en); } break; }
    case 'toggle': e.stopPropagation(); hap.t('medium'); mutate(d=>{ const x=d.entries.find(y=>y.id===v); if(x){ x.done=!x.done; x.u=Date.now(); } }); break;
    case 'filter': S.filter=v; hap.sel(); render(); break;
    case 'theme': LS.set('xz-theme',v); applyTheme(); hap.sel(); render(); break;
    case 'lock': hap.t('medium'); lock(); break;
    case 'relock': lock(); break;
    case 'chpw': openChangePw(); break;
    case 'addm': openAddMember(); break;
    case 'rmm': {
      const m=S.vault.members.find(x=>x.id===v);
      if(await confirmDlg(`Remove access for ${m?m.name:'this account'}?`)){
        if(await mutate(d=>{ d.members=d.members.filter(x=>x.id!==v); })) toast('Removed');
      } break; }
    case 'backup': copyText(JSON.stringify({exported:new Date().toISOString(), entries:S.vault.entries}, null, 2)).then(()=>{ hap.ok(); toast('Backup copied to clipboard'); }); break;
    case 'copyid': copyText(v).then(()=>{ hap.ok(); toast('ID copied'); }); break;
  }
});

render();
})();
</script>
